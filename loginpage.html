Login Page with Simple CSS Styling
Adds basic layout and spacing to make the form look cleaner.
<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
    }
    .container {
      width: 300px;
      margin: 100px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form action="/login" method="post">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
Login Page with Basic JavaScript Validation
Checks that fields are not empty before submitting.
<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <script>
    function validateForm() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === "" || pass === "") {
        alert("Please fill in both fields.");
        return false;
      }
      return true;
    }
  </script>
</head>
<body>
  <h2>Login</h2>
  <form onsubmit="return validateForm()">
    <label>Username:</label><br>
    <input id="username" type="text"><br><br>

    <label>Password:</label><br>
    <input id="password" type="password"><br><br>

    <button type="submit">Login</button>
  </form>
</body>
</html>
